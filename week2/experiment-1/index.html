<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スライドショー</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 16px;
    background: #f0f2f5;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", sans-serif;
  }

  .container {
    width: 100%;
    max-width: 640px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    padding: 28px;
  }

  h1 {
    margin: 0 0 20px;
    font-size: 22px;
    text-align: center;
    color: #333;
  }

  .slideshow {
    display: flex;
    justify-content: center;
  }

  #slide-image {
    width: 100%;
    max-width: 600px;
    border-radius: 12px;
    display: block;
  }

  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-top: 18px;
  }

  .nav-btn {
    padding: 8px 20px;
    border: none;
    border-radius: 10px;
    background: #6c8cff;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .nav-btn:hover {
    background: #5678f0;
  }

  #slide-count {
    text-align: center;
    color: #888;
    font-size: 13px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>スライドショー</h1>
  <div class="slideshow">
    <img id="slide-image" src="" alt="スライド画像">
  </div>
  <div class="controls">
    <button class="nav-btn" id="prev-btn">前へ</button>
    <button class="nav-btn" id="next-btn">次へ</button>
  </div>
  <div id="slide-count"></div>
</div>

<script>
  const images = [
    'https://placehold.jp/600x300.png?text=Slide%201',
    'https://placehold.jp/600x300.png?text=Slide%202',
    'https://placehold.jp/600x300.png?text=Slide%203',
    'https://placehold.jp/600x300.png?text=Slide%204'
  ];

  let current = 0;

  const slideImage = document.getElementById('slide-image');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  const slideCount = document.getElementById('slide-count');

  function render() {
    slideImage.src = images[current];
    slideCount.textContent = `${current + 1} / ${images.length}`;
  }

  function prev() {
    current = (current - 1 + images.length) % images.length;
    render();
  }

  function next() {
    current = (current + 1) % images.length;
    render();
  }

  prevBtn.addEventListener('click', prev);
  nextBtn.addEventListener('click', next);

  render();
</script>

</body>
</html>
