<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好きなスポーツ3選</title>
<style>
  /* すべての要素にborder-boxを適用し、paddingを含めたサイズ計算にする */
  * {
    box-sizing: border-box;
  }

  /* ページ全体の共通スタイル */
  /* 変更点：旧バージョンはここでflexboxを使い、1枚のスライドカードを画面中央に配置していた。
     カード一覧を表示する構成に変えたため、中央寄せ用のflexプロパティは不要になり削除した */
  body {
    margin: 0;
    min-height: 100vh;
    padding: 40px 16px;
    background: #f0f2f5;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", sans-serif;
    color: #333333;
  }

  /* 変更点：旧バージョンはスライドカード（.slide-container）の中の見出しだったため中央揃え・下余白28pxのみだったが、
     ページ全体の見出しになったのでmax-widthとauto marginでカード一覧と横幅を揃えている */
  h1 {
    margin: 0 auto 32px;
    max-width: 1080px;
    font-size: 20px;
    text-align: center;
    color: #333333;
  }

  /* 変更点：旧バージョンの.slide-container（1枚のカードをcolumn方向に並べる箱）に代わる要素。
     display:flexとflex-wrap:wrapの組み合わせで、3枚のカードを横並びにしつつ、
     画面幅が足りない場合は自動で折り返す（2列→1列）ようにしている */
  .card-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 24px;
    max-width: 1080px;
    margin: 0 auto;
  }

  /* 変更点：新規追加。各競技を1枚のカードとして独立させたスタイル。
     flex: 1 1 320px（伸びる・縮む・基準幅320px）を指定することで、
     .card-listのflex-wrapと連動して幅に応じた折り返しが機能する */
  .card {
    display: flex;
    flex-direction: column;
    flex: 1 1 320px;
    max-width: 340px;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    padding: 36px 28px;
    text-align: center;
  }

  /* 変更点：旧バージョンはJSのslideBackgrounds配列とcurrentIndexで背景を1つずつ動的に切り替えていたが、
     3枚とも同時に表示するようになったため、CSSのnth-childで各カードに直接固定の背景を割り当てている */
  .card:nth-child(1) { background: linear-gradient(135deg, #eaf6ff, #fef9e7); }
  .card:nth-child(2) { background: linear-gradient(135deg, #f3f0ff, #e9fef2); }
  .card:nth-child(3) { background: linear-gradient(135deg, #eafcff, #fbeaff); }

  /* 変更点：旧バージョンは1枚を大きく見せるためfont-size:150pxだったが、
     3枚を横に並べるスペースに収めるため96pxに縮小している */
  .illustration {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 16px;
    font-size: 96px;
    line-height: 1;
  }

  .card h2 {
    margin: 0 0 12px;
    font-size: 22px;
    color: #333333;
  }

  .card p {
    margin: 0;
    font-size: 15px;
    line-height: 1.7;
    color: #333333;
    text-align: left;
    /* 変更点：新規追加。flex-grow:1により、説明文の長さがカードごとに違っても
       各カードの高さ（.card-listがdisplay:flexなので既定でstretchされる）に合わせて
       余白が下に伸び、3枚の見た目の高さが揃う */
    flex-grow: 1;
  }
</style>
</head>
<body>

<!-- 変更点：旧バージョンは「表紙（無関係な絵文字を並べて答えを隠す）→前へ/次へで1枚ずつ競技を表示」という
     スライドショー構成だったが、今回はFlexboxの横並び・折り返しを見せるため、
     表紙とナビゲーションボタンを廃止し、3競技すべてを同時に一覧表示するカードレイアウトに変更した -->

<h1>私の好きなスポーツ3選</h1>

<div class="card-list">
  <div class="card">
    <div class="illustration">⚾</div>
    <h2>野球</h2>
    <p>ルールはやや複雑ですが、その奥にある相手との駆け引きに魅力を感じています。ちなみに自分は物心がついたときから阪神ファンです。</p>
  </div>

  <div class="card">
    <div class="illustration">🏸</div>
    <h2>バドミントン</h2>
    <p>他のスポーツと比べて比較的初心者でもプレーしやすいのが特徴です。自分も高校大学の部活サークルでやりました。</p>
  </div>

  <div class="card">
    <div class="illustration">🏂</div>
    <h2>スノーボード</h2>
    <p>大学２年で初めて遊び、そこで完全にはまりました。シーズンになると必ず一度はゲレンデに行き、現在はオーリーの練習をしています。</p>
  </div>
</div>

<!-- 変更点：旧バージョンにあったJavaScript（sports/decoyEmojis配列、renderCoverThumbs、renderSlide、
     前へ/次へボタンのイベントリスナーなど）は、動的な切り替えが不要になったため全て削除し、
     静的なHTML+CSSのみの構成にした -->

</body>
</html>
