<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好きなスポーツ3選</title>
<style>
  /* すべての要素にborder-boxを適用し、paddingを含めたサイズ計算にする */
  * {
    box-sizing: border-box;
  }

  /* ページ全体の共通スタイル */
  body {
    margin: 0;
    min-height: 100vh;
    padding: 40px 16px;
    background: #f0f2f5;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", sans-serif;
    color: #333333;
  }

  h1 {
    margin: 0 auto 32px;
    max-width: 1080px;
    font-size: 20px;
    text-align: center;
    color: #333333;
  }

  /* カードを横並びにし、入りきらない分は折り返す */
  .card-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 24px;
    max-width: 1080px;
    margin: 0 auto;
  }

  /* 各競技を1枚にまとめたカード。伸縮可・基準320pxで、幅が足りなければ折り返す */
  .card {
    display: flex;
    flex-direction: column;
    flex: 1 1 320px;
    max-width: 340px;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    padding: 36px 28px;
    text-align: center;
  }

  /* カードごとの背景（薄い色のグラデーション） */
  .card:nth-child(1) { background: linear-gradient(135deg, #eaf6ff, #fef9e7); }
  .card:nth-child(2) { background: linear-gradient(135deg, #f3f0ff, #e9fef2); }
  .card:nth-child(3) { background: linear-gradient(135deg, #eafcff, #fbeaff); }

  /* イラスト（絵文字）を表示する枠 */
  .illustration {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 16px;
    font-size: 96px;
    line-height: 1;
  }

  .card h2 {
    margin: 0 0 12px;
    font-size: 22px;
    color: #333333;
  }

  .card p {
    margin: 0;
    font-size: 15px;
    line-height: 1.7;
    color: #333333;
    text-align: left;
    /* カードの高さが揃っていても説明文は上詰めで読みやすく */
    flex-grow: 1;
  }
</style>
</head>
<body>

<h1>私の好きなスポーツ3選</h1>

<div class="card-list">
  <div class="card">
    <div class="illustration">⚾</div>
    <h2>野球</h2>
    <p>ルールはやや複雑ですが、その奥にある相手との駆け引きに魅力を感じています。ちなみに自分は物心がついたときから阪神ファンです。</p>
  </div>

  <div class="card">
    <div class="illustration">🏸</div>
    <h2>バドミントン</h2>
    <p>他のスポーツと比べて比較的初心者でもプレーしやすいのが特徴です。自分も高校大学の部活サークルでやりました。</p>
  </div>

  <div class="card">
    <div class="illustration">🏂</div>
    <h2>スノーボード</h2>
    <p>大学２年で初めて遊び、そこで完全にはまりました。シーズンになると必ず一度はゲレンデに行き、現在はオーリーの練習をしています。</p>
  </div>
</div>

</body>
</html>
